<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário Novo Sócio</title>
    <link rel="stylesheet" href="../../css/main.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="formulario-socio">
      <header class="formulario">
        <div class="dados">
          <label for="nome">Nome:</label>
          <input
            type="text"
            id="nome"
            required
            placeholder="Digite seu nome"
            minlength="2"
            maxlength="100"
          />
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
            pattern="[^@]+@[^@]+\.[^@]+"
          />
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" placeholder="(11) 99999-9999" />
        </div>
        <select class="opcoes-planos" required>
          <option value="" disabled selected>Selecione o Plano</option>
          <option value="">MENSAL</option>
          <option value="">ANUAL</option>
          <option value="">SEMESTRAL</option>
        </select>
        <input type="date" required />
        <fieldset>
          <legend>Status</legend>

          <label>
            <input type="radio" name="status" value="ADIMPLENTE" required />
            Adimplente
          </label>

          <label>
            <input type="radio" name="status" value="INADIMPLENTE" />
            Inadimplente
          </label>
        </fieldset>
        <div class="acoes-formulario">
          <button type="submit" class="btn-primario">Salvar</button>
          <button type="button" class="btn-secundario" id="btn-cancelar">
            Cancelar
          </button>
        </div>
      </header>
    </article>
  </body>
</html>
